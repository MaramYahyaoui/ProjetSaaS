input {
  file {
    path => "/data/logs/*.json"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
  }
}
filter {
  grok {
    match => { "[log][file][path]" => "%{GREEDYDATA}/%{DATA:file_id}__%{GREEDYDATA:source_file}" }
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["parse_error"]
  }
  mutate {
    add_tag => ["json"]
    remove_field => ["timestamp", "@version"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-saas-%{+YYYY.MM.dd}"
    manage_template => false
  }
}