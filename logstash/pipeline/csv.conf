input {
  file {
    path => "/data/logs/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}
filter {
  grok {
    match => { "[log][file][path]" => "%{GREEDYDATA}/%{DATA:file_id}__%{GREEDYDATA:source_file}" }
  }
  csv {
    separator => ","
    skip_header => true
    columns => ["timestamp", "level", "service", "endpoint", "http_method", "status_code",
                "response_time_ms", "client_ip", "user_id", "feature", "query_duration_ms", "message"]
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["parse_error"]
  }
  mutate {
    convert => { "status_code" => "integer" "response_time_ms" => "float" "query_duration_ms" => "float" }
    add_tag => ["csv"]
    remove_field => ["timestamp", "@version"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-saas-%{+YYYY.MM.dd}"
    manage_template => false
  }
}